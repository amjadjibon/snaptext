# Generates SnapText.xcodeproj (gitignored): `xcodegen generate`, or `just ios`.
name: SnapText
options:
  bundleIdPrefix: com.amjadjibon
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SnapText:
    path: ..
targets:
  SnapTextApp:
    type: application
    platform: iOS
    sources:
      - SnapText
    dependencies:
      - package: SnapText
        product: SnapTextKit
    settings:
      base:
        PRODUCT_NAME: SnapText
        PRODUCT_MODULE_NAME: SnapTextApp
        PRODUCT_BUNDLE_IDENTIFIER: com.amjadjibon.snaptext
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SnapText
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: SnapText uses the camera to scan documents. Images are read on your device and never uploaded.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
